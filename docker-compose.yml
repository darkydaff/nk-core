services:
  db:
    image: mariadb:12.2
    container_name: nk-panel-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --log_bin_trust_function_creators=ON
    env_file:
      - .env
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MARIADB_DATABASE: ${DB_DATABASE:-amnezia_panel}
      MARIADB_USER: ${DB_USERNAME:-amnezia}
      MARIADB_PASSWORD: ${DB_PASSWORD:-amnezia}
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d
      - ./my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nk-panel-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-local}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-amnezia_panel}
      DB_USERNAME: ${DB_USERNAME:-amnezia}
      DB_PASSWORD: ${DB_PASSWORD:-amnezia}
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-secret_api_key}
      CENTRIFUGO_API_URL: http://centrifugo:8000/api
      CENTRIFUGO_TOKEN_HMAC_SECRET: ${CENTRIFUGO_TOKEN_HMAC_SECRET:-secret_hmac}
    ports:
      - "8443:443"
    volumes:
      - .:/var/www/html
      - /var/www/html/node_modules
      - /var/www/html/vendor
      - twig_cache:/var/www/html/storage/cache/twig
      - panel_logs:/var/log/nk-panel
      - ./certs:/certs:ro

  beanstalkd:
    image: schickling/beanstalkd
    container_name: nk-beanstalkd
    restart: unless-stopped
    ports:
      - "11300:11300"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nk-panel-worker
    restart: unless-stopped
    command: /start.sh worker
    depends_on:
      db:
        condition: service_healthy
      beanstalkd:
        condition: service_started
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-local}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-amnezia_panel}
      DB_USERNAME: ${DB_USERNAME:-amnezia}
      DB_PASSWORD: ${DB_PASSWORD:-amnezia}
      QUEUE_HOST: beanstalkd
      QUEUE_PORT: 11300
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-secret_api_key}
      CENTRIFUGO_API_URL: http://centrifugo:8000/api
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/amnezia:/opt/amnezia
      - panel_logs:/var/log/nk-panel

  centrifugo:
    image: centrifugo/centrifugo:v5
    container_name: nk-centrifugo
    restart: unless-stopped
    volumes:
      - ./centrifugo.json:/centrifugo/config.json
    command: centrifugo -c config.json
    env_file:
      - .env
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

volumes:
  db_data:
  twig_cache:
  panel_logs:
