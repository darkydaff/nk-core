services:
  db:
    image: mysql:8.4
    container_name: nk-panel-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --mysql-native-password=ON --log_bin_trust_function_creators=ON
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_DATABASE:-amnezia_panel}
      MYSQL_USER: ${DB_USERNAME:-amnezia}
      MYSQL_PASSWORD: ${DB_PASSWORD:-amnezia}
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d
      - ./my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nk-panel-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-local}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-amnezia_panel}
      DB_USERNAME: ${DB_USERNAME:-amnezia}
      DB_PASSWORD: ${DB_PASSWORD:-amnezia}
    volumes:
      - ./:/var/www/html
      - /var/www/html/vendor
      - twig_cache:/var/www/html/storage/cache/twig
    ports:
      - "8084:80"

  beanstalkd:
    image: schickling/beanstalkd
    container_name: nk-beanstalkd
    restart: unless-stopped
    ports:
      - "11300:11300"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nk-panel-worker
    restart: unless-stopped
    command: php /var/www/html/bin/queue_worker.php
    depends_on:
      db:
        condition: service_healthy
      beanstalkd:
        condition: service_started
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-local}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-amnezia_panel}
      DB_USERNAME: ${DB_USERNAME:-amnezia}
      DB_PASSWORD: ${DB_PASSWORD:-amnezia}
      QUEUE_HOST: beanstalkd
      QUEUE_PORT: 11300
    volumes:
      - ./:/var/www/html
      - /var/www/html/vendor
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/amnezia:/opt/amnezia

volumes:
  db_data:
  twig_cache:
